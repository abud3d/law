name: Legal library audit
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'library/**'
      - 'scripts/**'
      - '.github/workflows/legal-library-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test audit rules
        run: python3 -m unittest discover -s scripts -p "test_*.py" -v
      - name: Verify all imported records and produce structural report
        run: |
          python3 scripts/audit_library.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("library/data/saudi-legal-moj.json").read_text(encoding="utf-8"))
          report=json.loads(Path("library/data/legal-audit.json").read_text(encoding="utf-8"))
          assert len(data)==3185, f"Unexpected dataset size: {len(data)}"
          assert report["total_records"]==3185
          assert len(report["legislation"])>0
          print("Structural audit passed:",len(data),"records,",len(report["legislation"]),"canonical names")
          print("Review flags:",report["issue_counts"])
          PY
      - name: Validate legal category coverage for all imported titles
        run: node scripts/test_legal_categories.cjs
      - name: Validate sourced official legislation catalog
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse
          data=json.loads(Path("library/data/official-legislation-catalog.json").read_text(encoding="utf-8"))
          assert len(data)>=60
          assert len({x["name"] for x in data})==len(data)
          for x in data:
              assert x["record_type"] in {"official_legislation_reference","official_legislation_index_reference"}
              assert x["article_text_imported"] is False
              assert x["verified_source_page"] is True
              assert urlparse(x["url"]).hostname=="laws.boe.gov.sa"
              assert x["category"] in {"civil","commercial","criminal","procedure","labor","family","realestate","administrative","finance","iptech","health","other"}
          print(len(data),"sourced legal references validated")
          PY
      - name: Validate inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path("library/index.html").read_text(encoding="utf-8")
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',html)
          assert scripts,"No inline scripts found"
          assert r"\\u" not in "\n".join(scripts), "Doubly escaped Unicode ranges break Arabic normalization"
          Path("/tmp/legal-library-inline.js").write_text("\n".join(scripts),encoding="utf-8")
          PY
          node --check /tmp/legal-library-inline.js
      - name: Publish audit summary in Actions
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path("library/data/legal-audit.json")
          lines = ["## Saudi legal library audit", ""]
          if path.exists():
              report = json.loads(path.read_text(encoding="utf-8"))
              lines.extend([
                  f"- Imported records: **{report['total_records']:,}**",
                  f"- Canonical legislation names: **{report['legislation_names']}**",
                  "- Scope: structural checks only; **not** official legal-text verification.",
                  "",
                  "| Review flag | Records |",
                  "|---|---:|",
              ])
              for key, count in sorted(report["issue_counts"].items(), key=lambda pair: -pair[1]):
                  lines.append(f"| {key} | {count:,} |")
              lines.extend(["", "Download the full JSON report from the workflow artifacts."])
          else:
              lines.append("Audit report not generated; inspect failed steps above.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(lines) + "\n")
          PY
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: legal-library-3185-audit
          path: library/data/legal-audit.json
          retention-days: 30
