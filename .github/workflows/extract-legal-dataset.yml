name: Extract Saudi Legal Dataset

on:
  push:
    paths:
      - "library/data/saudi-legal-moj.parquet"
      - "scripts/extract_legal_dataset.py"
      - ".github/workflows/extract-legal-dataset.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Parquet reader
        run: python -m pip install --upgrade pip pyarrow
      - name: Extract dataset
        run: python scripts/extract_legal_dataset.py
      - name: Commit extracted data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library/data/saudi-legal-moj.json library/data/saudi-legal-moj-meta.json
          if git diff --cached --quiet; then
            echo "Extracted data already up to date"
            exit 0
          fi
          git commit -m "Extract Saudi legal dataset to searchable JSON"
          git push
